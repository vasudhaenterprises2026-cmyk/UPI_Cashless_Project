-- simple trigger to update updated_at
CREATE OR REPLACE FUNCTION public.set_updated_at()
RETURNS TRIGGER AS $$
BEGIN
    NEW.updated_at = now();
    RETURN NEW;
END;
$$ LANGUAGE plpgsql;

CREATE TRIGGER businesses_updated_at
BEFORE UPDATE ON public.businesses
FOR EACH ROW EXECUTE FUNCTION public.set_updated_at();

CREATE TRIGGER shops_updated_at
BEFORE UPDATE ON public.shops
FOR EACH ROW EXECUTE FUNCTION public.set_updated_at();

-- RLS foundation (starter)
ALTER TABLE public.businesses ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.profiles ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.user_business_roles ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.products ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.shops ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.shop_prices ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.inventory_movements ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.orders ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.expenses ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.audit_logs ENABLE ROW LEVEL SECURITY;

CREATE POLICY "allow_authenticated_users_to_view_catalog" ON public.products
FOR SELECT TO authenticated USING (true);

CREATE POLICY "allow_authenticated_users_to_view_businesses" ON public.businesses
FOR SELECT TO authenticated USING (true);

CREATE POLICY "profiles_are_visible_to_self" ON public.profiles
FOR SELECT TO authenticated USING (auth.uid() = id);

CREATE POLICY "user_business_roles_self_read" ON public.user_business_roles
FOR SELECT TO authenticated USING (user_id = auth.uid());

CREATE POLICY "shops_read_all_authenticated" ON public.shops
FOR SELECT TO authenticated USING (true);

CREATE POLICY "inventory_read_all_authenticated" ON public.inventory_movements
FOR SELECT TO authenticated USING (true);

CREATE POLICY "orders_read_all_authenticated" ON public.orders
FOR SELECT TO authenticated USING (true);

CREATE POLICY "expenses_read_all_authenticated" ON public.expenses
FOR SELECT TO authenticated USING (true);

