-- Phase 1 schema for SRS & SHREEM BUSINESS OS
-- PostgreSQL / Supabase ready

CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

CREATE TYPE public.business_type AS ENUM ('SRS_ENTERPRISES', 'SHREEM_SM_FOOD', 'GROUP_SHARED');
CREATE TYPE public.product_category AS ENUM ('BATTER', 'RAW_MATERIAL', 'PACKAGING', 'PACKAGED_GOOD', 'OTHER');
CREATE TYPE public.stock_movement_type AS ENUM ('OPENING_BALANCE', 'PURCHASE', 'PRODUCTION_OUTPUT', 'CONSUMPTION', 'TRANSFER_IN', 'TRANSFER_OUT', 'DISPATCH', 'RETURN', 'ADJUSTMENT', 'WASTAGE', 'SALE', 'REVERSE');
CREATE TYPE public.order_status AS ENUM ('DRAFT', 'APPROVED', 'DISPATCH_PENDING', 'PARTIALLY_DISPATCHED', 'DISPATCHED', 'INVOICED', 'PAID_PARTIAL', 'PAID', 'CANCELLED');
CREATE TYPE public.role_name AS ENUM ('OWNER_SUPER_ADMIN', 'PRODUCTION_MANAGER', 'MARKETING_EMPLOYEE', 'DELIVERY_EMPLOYEE', 'ACCOUNTANT');

CREATE TABLE public.businesses (
    id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
    name TEXT NOT NULL,
    code TEXT NOT NULL UNIQUE,
    business_type public.business_type NOT NULL,
    status TEXT NOT NULL DEFAULT 'ACTIVE',
    created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
    updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
);

CREATE TABLE public.profiles (
    id UUID PRIMARY KEY REFERENCES auth.users(id) ON DELETE CASCADE,
    full_name TEXT NOT NULL,
    phone TEXT,
    avatar_url TEXT,
    active BOOLEAN NOT NULL DEFAULT TRUE,
    created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
    updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
);

CREATE TABLE public.role_permissions (
    id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
    role_name public.role_name NOT NULL,
    permission_key TEXT NOT NULL,
    description TEXT,
    UNIQUE (role_name, permission_key)
);

CREATE TABLE public.user_business_roles (
    id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
    user_id UUID NOT NULL REFERENCES public.profiles(id) ON DELETE CASCADE,
    business_id UUID NOT NULL REFERENCES public.businesses(id) ON DELETE CASCADE,
    role_name public.role_name NOT NULL,
    active BOOLEAN NOT NULL DEFAULT TRUE,
    created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
    UNIQUE (user_id, business_id, role_name)
);

CREATE TABLE public.products (
    id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
    business_id UUID NOT NULL REFERENCES public.businesses(id) ON DELETE CASCADE,
    name TEXT NOT NULL,
    product_code TEXT NOT NULL,
    category public.product_category NOT NULL,
    unit_of_measure TEXT NOT NULL,
    pack_size NUMERIC(12,2) DEFAULT 0,
    is_packaged_product BOOLEAN NOT NULL DEFAULT FALSE,
    shelf_life_days INTEGER,
    active BOOLEAN NOT NULL DEFAULT TRUE,
    created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
    UNIQUE (business_id, product_code)
);

CREATE TABLE public.product_variants (
    id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
    product_id UUID NOT NULL REFERENCES public.products(id) ON DELETE CASCADE,
    variant_name TEXT NOT NULL,
    unit_of_measure TEXT NOT NULL,
    pack_size NUMERIC(12,2) NOT NULL,
    is_default BOOLEAN NOT NULL DEFAULT FALSE,
    active BOOLEAN NOT NULL DEFAULT TRUE,
    created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
    UNIQUE (product_id, variant_name)
);

CREATE TABLE public.shops (
    id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
    business_id UUID NOT NULL REFERENCES public.businesses(id) ON DELETE CASCADE,
    name TEXT NOT NULL,
    address TEXT,
    area TEXT,
    contact_name TEXT,
    phone TEXT,
    email TEXT,
    assigned_salesperson_id UUID REFERENCES public.profiles(id),
    customer_status TEXT NOT NULL DEFAULT 'ACTIVE',
    credit_terms_days INTEGER DEFAULT 0,
    credit_limit NUMERIC(14,2) DEFAULT 0,
    outstanding_balance NUMERIC(14,2) NOT NULL DEFAULT 0,
    created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
    updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
);

CREATE TABLE public.shop_prices (
    id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
    shop_id UUID NOT NULL REFERENCES public.shops(id) ON DELETE CASCADE,
    product_id UUID NOT NULL REFERENCES public.products(id) ON DELETE CASCADE,
    unit_price NUMERIC(14,2) NOT NULL,
    valid_from TIMESTAMPTZ NOT NULL,
    valid_to TIMESTAMPTZ,
    source TEXT NOT NULL DEFAULT 'MANUAL',
    created_by UUID REFERENCES public.profiles(id),
    created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
    UNIQUE (shop_id, product_id, valid_from)
);

CREATE TABLE public.inventory_locations (
    id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
    business_id UUID NOT NULL REFERENCES public.businesses(id) ON DELETE CASCADE,
    name TEXT NOT NULL,
    location_type TEXT NOT NULL,
    active BOOLEAN NOT NULL DEFAULT TRUE,
    created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
    UNIQUE (business_id, name)
);

CREATE TABLE public.inventory_movements (
    id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
    business_id UUID NOT NULL REFERENCES public.businesses(id) ON DELETE CASCADE,
    product_id UUID NOT NULL REFERENCES public.products(id) ON DELETE CASCADE,
    location_id UUID REFERENCES public.inventory_locations(id),
    movement_type public.stock_movement_type NOT NULL,
    quantity NUMERIC(14,4) NOT NULL,
    unit_cost NUMERIC(14,4),
    reference_type TEXT,
    reference_id UUID,
    created_by UUID REFERENCES public.profiles(id),
    approved_by UUID REFERENCES public.profiles(id),
    approved_at TIMESTAMPTZ,
    notes TEXT,
    created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
    UNIQUE (reference_type, reference_id, movement_type)
);

CREATE TABLE public.inventory_balances (
    id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
    business_id UUID NOT NULL REFERENCES public.businesses(id) ON DELETE CASCADE,
    product_id UUID NOT NULL REFERENCES public.products(id) ON DELETE CASCADE,
    location_id UUID NOT NULL REFERENCES public.inventory_locations(id) ON DELETE CASCADE,
    quantity_on_hand NUMERIC(14,4) NOT NULL DEFAULT 0,
    low_stock_threshold NUMERIC(14,4) DEFAULT 0,
    updated_at TIMESTAMPTZ NOT NULL DEFAULT now(),
    UNIQUE (business_id, product_id, location_id)
);

CREATE TABLE public.orders (
    id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
    business_id UUID NOT NULL REFERENCES public.businesses(id) ON DELETE CASCADE,
    shop_id UUID NOT NULL REFERENCES public.shops(id) ON DELETE CASCADE,
    order_number TEXT NOT NULL UNIQUE,
    status public.order_status NOT NULL DEFAULT 'DRAFT',
    order_date TIMESTAMPTZ NOT NULL DEFAULT now(),
    approved_by UUID REFERENCES public.profiles(id),
    total_amount NUMERIC(14,2) NOT NULL DEFAULT 0,
    created_by UUID REFERENCES public.profiles(id),
    created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
    updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
);

CREATE TABLE public.order_lines (
    id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
    order_id UUID NOT NULL REFERENCES public.orders(id) ON DELETE CASCADE,
    product_id UUID NOT NULL REFERENCES public.products(id) ON DELETE CASCADE,
    quantity NUMERIC(14,4) NOT NULL,
    unit_price NUMERIC(14,2) NOT NULL,
    discount_amount NUMERIC(14,2) NOT NULL DEFAULT 0,
    tax_amount NUMERIC(14,2) NOT NULL DEFAULT 0,
    total_amount NUMERIC(14,2) NOT NULL DEFAULT 0,
    created_at TIMESTAMPTZ NOT NULL DEFAULT now()
);

CREATE TABLE public.invoices (
    id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
    business_id UUID NOT NULL REFERENCES public.businesses(id) ON DELETE CASCADE,
    order_id UUID REFERENCES public.orders(id),
    invoice_number TEXT NOT NULL UNIQUE,
    total_amount NUMERIC(14,2) NOT NULL,
    status TEXT NOT NULL DEFAULT 'DRAFT',
    issued_at TIMESTAMPTZ NOT NULL DEFAULT now(),
    created_by UUID REFERENCES public.profiles(id),
    created_at TIMESTAMPTZ NOT NULL DEFAULT now()
);

CREATE TABLE public.expenses (
    id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
    business_id UUID NOT NULL REFERENCES public.businesses(id) ON DELETE CASCADE,
    expense_category TEXT NOT NULL,
    title TEXT NOT NULL,
    amount NUMERIC(14,2) NOT NULL,
    incurred_on TIMESTAMPTZ NOT NULL DEFAULT now(),
    vendor TEXT,
    payment_method TEXT,
    reference_number TEXT,
    notes TEXT,
    status TEXT NOT NULL DEFAULT 'APPROVED',
    created_by UUID REFERENCES public.profiles(id),
    created_at TIMESTAMPTZ NOT NULL DEFAULT now()
);

CREATE TABLE public.audit_logs (
    id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
    business_id UUID REFERENCES public.businesses(id),
    entity_type TEXT NOT NULL,
    entity_id UUID,
    action TEXT NOT NULL,
    actor_id UUID REFERENCES public.profiles(id),
    payload JSONB,
    created_at TIMESTAMPTZ NOT NULL DEFAULT now()
);

